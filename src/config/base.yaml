# Configuración base: estrategias E1/E2/E3/E4
# Objetivo: reproducibilidad (mismos parámetros -> mismos resultados)

project:
  name: trading_predict
  timezone: "America/New_York"
  seed: 42

universe:
  # Universo de descarga/limpieza: NO se lista a mano. Se DERIVA de
  # tickers_by_strategy (fuente única de verdad) vía
  # src.utils.get_universe_tickers(). Acá solo van activos reservados que
  # todavía no pertenecen a una estrategia activa (extras de E3 / E4 futuro),
  # para que la descarga en batch igual los baje.
  extra_download_tickers:
    - "TSLA"     # E3 (reservado, aún no en e3_intraday)
    - "AMD"      # E3 (reservado, aún no en e3_intraday)
    - "TGNO4.BA" # E4 pairs trading (reservado)
    - "YPF"      # E4 pairs trading (reservado)
    - "KO"       # E4 pairs trading (reservado)
    - "PEP"      # E4 pairs trading (reservado)
    - "XOM"      # E4 pairs trading (reservado)
    - "CVX"      # E4 pairs trading (reservado)
    - "JPM"      # E4 pairs trading (reservado)
    - "BAC"      # E4 pairs trading (reservado)
    - "CAT"      # E4 pairs trading (reservado)
    - "DE"       # E4 pairs trading (reservado)

  # Asignación por estrategia (para entrenar/validar/backtest).
  tickers_by_strategy:
    e1_conservative:
      - "YPFD.BA"
      - "GGAL.BA"
      - "PAMP.BA"
      - "BYMA.BA"
      - "CEPU.BA"
      - "AAPL"
      - "MSFT"
      - "JNJ"
      - "PG"
      - "V"
    e2_moderate:
      - "NVDA"
      - "GOOGL"
      - "AMZN"
      - "META"
      - "NFLX"
      - "BBAR.BA"
      - "BMA.BA"
      - "EDN.BA"
      - "TGSU2.BA"
      - "LOMA.BA"
      # EEUU adicionales (con CEDEAR en BYMA para operar en el mercado local)
      - "LLY"    # Eli Lilly — Salud/Farma
      - "ISRG"   # Intuitive Surgical — Salud/MedTech
      - "ABBV"   # AbbVie — Salud/Farma
      - "VRTX"   # Vertex Pharma — Salud/Biotech
      - "AVGO"   # Broadcom — Semiconductores
      - "QCOM"   # Qualcomm — Semiconductores
      - "NOW"    # ServiceNow — Software
      - "CRM"    # Salesforce — Software
      - "ORCL"   # Oracle — Software/Cloud
      - "MA"     # Mastercard — Financieras/Pagos
      - "SPGI"   # S&P Global — Financieras/Data
      - "GS"     # Goldman Sachs — Financieras/Banca
      - "COST"   # Costco — Consumo/Retail
      - "HD"     # Home Depot — Consumo discrecional
      - "WMT"    # Walmart — Consumo/Staples
      - "MCD"    # McDonald's — Consumo/Restaurantes
      - "GE"     # GE Aerospace — Industriales/Aeroespacial
      - "UNP"    # Union Pacific — Industriales/Transporte
      - "HON"    # Honeywell — Industriales
      - "TMUS"   # T-Mobile US — Comunicaciones/Telecom
    e3_intraday:
      - "SPY"
      - "AAPL"
      - "NVDA"
      - "QQQ"
    # e4: tickers se definirán cuando se reconstruya la estrategia

data:
  # Dataset congelado para entrenamientos reproducibles.
  # Baseline, champion, candidate y Optuna usan exactamente este rango.
  # Override: pasar --use-latest-data al comando de entrenamiento (descarga
  # datos frescos y extiende `end` hasta hoy; `start` se preserva como piso).
  training_window:
    daily:        # E1 (90d), E2 (20d), E4
      start: "2016-03-03"
      end:   "2026-03-03"
    intraday:     # E3 (5-min)
      start: "2026-01-02"
      end:   "2026-03-03"

  # Descarga de datos al entrenar (E1/E2/E3 train_pipeline y DAGs de Airflow).
  # Comportamiento por defecto: descargar datos nuevos de forma incremental
  # (solo las fechas faltantes) y acumularlos en el CSV. Override por corrida:
  # pasar --skip-download a la CLI para usar los datos existentes sin descargar.
  download:
    enabled: true          # descargar datos nuevos por defecto al entrenar
    incremental: true       # true = solo fechas faltantes (desde la última del CSV - overlap); false = período completo
    overlap_days: 5         # al bajar incremental, re-solicitar los últimos N días (robustez / dedup)
    daily_period: "10y"     # período de bootstrap cuando el CSV diario aún no existe
    intraday_period: "60d"  # período de bootstrap cuando el CSV intradía aún no existe

  # Features exógenas (macro / cross-asset / commodities) — Fase 1: Bloques A+B+C+D.
  # Ver src/data/macro.py y docs/FEATURES.md. DEFAULT false → cero impacto en el pipeline
  # diario del champion; se activa por corrida con --exog o poniendo enabled: true tras la
  # ablación. Cuando enabled, el pipeline (1) refresca el cache exógeno al entrenar, (2)
  # carga el exog por ticker y (3) agrega strategies.<e>.features.exog_core al set activo.
  # No requiere API keys en la Fase 1 (FRED se baja por su CSV público).
  exog:
    # PAUSADO: la ablación/selección previa quedó INVALIDADA por un bug de datos — la serie
    # ICE BofA HY OAS (BAMLH0A0HYM2) tiene la historia pública restringida en FRED, dejaba
    # hy_oas_z NaN antes de 2023 y RECORTABA el train set de los modelos exógenos (entrenaban
    # ~2023-2026 vs base 2016-2026 → comparación injusta). Corregido: hy_oas_z ahora es un
    # proxy HYG/LQD (yfinance, historia completa). Re-ablación con datos corregidos en curso
    # antes de re-activar con una selección válida. Ver reports/ablation/ablation_report.md.
    enabled: false
    history_start: "2014-01-01"  # bootstrap con warmup para rolling de 252d antes de 2016
    # Allowlist per-ticker (se repuebla tras la re-ablación con datos corregidos + held-out).
    # Lista vacía/ausente = exógenas para todos (modo ablación con --exog).
    tickers: []

costs:
  # Costos round-trip (entrada+salida). Usar en backtest neto.
  daily_round_trip_bps: 10
  intraday_round_trip_bps: 20

splits:
  method: "walk_forward"
  folds: 5
  # Si H=90, embargo >= 90 días.
  # El embargo debe ser >= al horizonte de predicción para evitar leakage.
  # embargo_days = horizon_days es la regla mínima
  # El embargo descarta N días entre el fin de train y el inicio de test,
  # rompiendo la correlación y evitando que el modelo "vea" información futura.
  embargo_days:
    e1: 90
    e2: 20
    e3: 6  # horizon_bars=6; en barras (5-min), no en días — mismo principio que E1/E2

strategies:
  e1_conservative:
    enabled: true
    frequency: "1D"
    lookback_days: 360
    horizon_days: 90
    rebalance: "monthly"

    thresholds:
      tau_buy: 0.02
      tau_sell: 0.00

    features:
      # Features activas para ENTRENAR modelos nuevos de esta estrategia. El catálogo
      # completo (incluidas históricas desactivadas) vive en src/e1/build_features.py::
      # compute_e1_features — ese archivo NUNCA borra código de una feature mientras
      # algún modelo vivo (ver models/registry.json) todavía la use; acá se decide
      # únicamente cuáles se usan para entrenamientos nuevos.
      # Nota: la promoción es por ticker, así que dos tickers de la misma estrategia
      # pueden terminar con contratos de features distintos si uno adopta una
      # iteración nueva y el otro no — es esperable, no un bug.
      # Changelog:
      #   - 2026-07-18: restauradas vol_4w, sma_200, close_sma200_dist en el catálogo
      #     (eliminadas ~feb-2026 por multicolinealidad) tras detectar que rompían la
      #     re-evaluación fair-window de champions viejos; siguen SIN estar activas acá.
      active:
        - ret_1w
        - ret_4w
        - ret_13w
        - vol_regime
        - atr_14
        - vol_zscore_60
        - sma_50
        - sma50_sma200_ratio
        - macd_hist
        - bb_pct_b
        - bb_bandwidth
        - adx_14

      # Núcleo exógeno (Bloques A/B/C/D) que se AGREGA a `active` cuando data.exog.enabled
      # (o --exog). DESACTIVADO por default (data.exog.enabled: false) — disponible para
      # exploración per-ticker futura. Se calcula en compute_e1_features(df, exog=...).
      # Catálogo completo disponible (ver docs/FEATURES.md):
      #   A: vix_ts, vix_pctl_252, hy_oas_z, curve_10y2y, dxy_mom_20, spy_mom_20, spy_mom_60
      #   B: rel_strength_sector, sector_rotation, beta_60   C: breakeven_10y, jobless_claims_z, nfci, rate_shock_10y
      #   D: oil_mom_20, copper_mom_20, gold_mom_20, soy_mom_20
      exog_core:
        - vix_ts
        - vix_pctl_252
        - hy_oas_z
        - curve_10y2y
        - spy_mom_20
        - rel_strength_sector
        - sector_rotation
        - breakeven_10y
        - nfci

    risk:
      stop_loss_pct: 0.10
      take_profit_pct: 0.15
      trailing_stop: false

    model:
      type: "GRU"
      # class: nombre registrado en src/models/registry.py que el pipeline instancia
      # (dispatch por config). Si se omite, default = "GRURegressor" → comportamiento
      # idéntico al actual. Para usar otro modelo, registrarlo con @register_model,
      # agregarlo a _LAZY_TARGETS y poner acá su nombre. `type` es solo metadata.
      class: "GRURegressor"
      gru_units: [64, 32]  # REDUCIDO de [128, 64] → menos parámetros = menos overfitting
      dropout: 0.3  # AUMENTADO de 0.2 → más regularización
      recurrent_dropout: 0.2  # AUMENTADO de 0.1 → más regularización en GRU
      dense_units: 16  # REDUCIDO de 32 → arquitectura más simple
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adamw"
      learning_rate: 0.001
      weight_decay: 0.0
      batch_size: 64
      max_epochs: 100  # REDUCIDO de 200 → evitar sobreajuste
      early_stopping_patience: 10  # REDUCIDO de 15 → parar antes si no mejora
      clipnorm: 1.0

    backtest:
      holding_period_days: 90  # Mantener posición por 90 días (igual que horizon)
      allow_short: false  # Solo long positions (estrategia conservadora)
      max_position: 1.0  # 100% del capital en una posición

  e2_moderate:
    enabled: true
    frequency: "1D"
    lookback_days: 60
    horizon_days: 20
    rebalance: "daily"   # Metadata declarativa (no la lee el código; el backtest usa holding_period_days). Diario para reflejar el retrain diario.

    thresholds:
      tau_buy: 0.025       # +2.5% predicho → señal compra
      tau_sell: 0.00        # 0% o menos → cerrar posición

    features:
      # Features activas para ENTRENAR modelos nuevos de esta estrategia. El catálogo
      # completo (incluidas históricas desactivadas) vive en src/e2/build_features.py::
      # compute_e2_features — ese archivo NUNCA borra código de una feature mientras
      # algún modelo vivo (ver models/registry.json) todavía la use; acá se decide
      # únicamente cuáles se usan para entrenamientos nuevos.
      # Nota: la promoción es por ticker, así que dos tickers de la misma estrategia
      # pueden terminar con contratos de features distintos si uno adopta una
      # iteración nueva y el otro no — es esperable, no un bug.
      active:
        - ret_1d
        - ret_20d
        - vol_20d
        - atr_14
        - vol_ratio_20d
        - sma50_sma200_ratio
        - close_sma50_dist
        - macd_hist
        - rsi_14
        - bb_pct_b
        - adx_14
        - skew_ret_20d

      # Núcleo exógeno (Fase 1, Bloques A/B/C/D) que se AGREGA a `active` cuando
      # data.exog.enabled (o --exog). Se calcula en compute_e2_features(df, exog=...).
      # Catálogo completo disponible (activar por ablación editando esta lista):
      #   A: vix_ts, vix_pctl_252, hy_oas_z, curve_10y2y, dxy_mom_20, spy_mom_20, spy_mom_60
      #   B: rel_strength_sector, sector_rotation, beta_60
      #   C: breakeven_10y, jobless_claims_z, nfci, rate_shock_10y
      #   D: oil_mom_20, copper_mom_20, gold_mom_20, soy_mom_20
      exog_core:
        - vix_ts
        - vix_pctl_252
        - hy_oas_z
        - curve_10y2y
        - spy_mom_20
        - rel_strength_sector
        - sector_rotation
        - breakeven_10y
        - nfci

    risk:
      stop_loss_pct: 0.07   # Stop loss del 7%
      take_profit_pct: 0.10  # Take profit del 10%
      trailing_stop: false

    model:
      type: "LSTM"
      # class: ver nota en e1_conservative.model.class. Default = "LSTMRegressor".
      class: "LSTMRegressor"
      lstm_units: [128, 64]  # 2 capas LSTM
      dropout: 0.2
      dense_units: 32
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adamw"
      learning_rate: 0.001
      weight_decay: 0.0
      batch_size: 64
      max_epochs: 150
      early_stopping_patience: 12
      clipnorm: 1.0

    backtest:
      holding_period_days: 20
      allow_short: false
      max_position: 1.0

  e3_intraday:
    enabled: false  # Habilitar después del baseline + EDA
    frequency: "5min"
    lookback_bars: 96    # 8 horas de historia (12 barras/hora × 8h)
    horizon_bars: 6      # 30 minutos hacia adelante (6 barras × 5min)

    thresholds:
      tau_buy: 0.0025    # Señal compra: retorno predicho >= 0.25% (> costo round-trip 20bps)
      tau_sell: 0.0025   # Señal venta/short: retorno predicho <= -0.25%

    # Split temporal para baseline (simple, sin walk-forward)
    # Walk-forward se reserva para el LSTM donde tiene más valor
    splits:
      train_frac: 0.70
      val_frac: 0.15
      # test_frac implícito: 0.15

    baseline:
      model: Ridge
      alpha: 100.0  # Alto para 96×9=864 features aplanadas sobre retornos de 30min

    model:
      type: "LSTM"
      ensemble_members: 3      # Promedia N modelos con distintas semillas → predicciones más estables
      consensus_tol: 0.0005    # Filtro de consenso: umbral de std entre miembros (5 bps); señal suprimida si std >= tol
      lstm_hidden_size: 128    # Aumentado de 64 → 128 (2+ años de datos disponibles via Alpaca)
      lstm_num_layers: 2       # 2 capas apiladas internamente por PyTorch nn.LSTM
      dense_units: 32          # Capa densa intermedia: LSTM → Dense(ReLU) → Linear(1)
      dropout: 0.2
      optimizer: "adamw"       # Consistente con E1/E2 (AdamW = Adam + weight decay desacoplado)
      learning_rate: 1e-3
      weight_decay: 0.0
      batch_size: 256
      max_epochs: 50           # Aumentado de 30 → 50 (más datos, más épocas necesarias)
      early_stopping_patience: 7
      clipnorm: 1.0            # Gradient clipping (consistente con E1/E2)
      loss: "huber"
      huber_delta: 1.0

    backtest:
      execution_delay_bars: 1
      allow_short: true
      max_position: 1.0

  e4_pairs:
    enabled: false  # TODO: rebuild from scratch
    frequency: "1D"

reporting:
  metrics:
    ml: ["mae", "rmse", "ic", "directional_accuracy"]
    trading: ["cagr", "sharpe", "sortino", "max_drawdown", "calmar", "profit_factor", "turnover", "win_rate"]
  output_dir: "reports"

lifecycle:
  enabled: true
  registry_path: "models/registry.json"
  metrics_log_path: "models/metrics_log.jsonl"

  guardrails:
    # Phase 1: only reject technically broken models.
    # Phase 2 (future): empirical thresholds from metrics_log.jsonl after 5-10 runs.
    phase: 1
    min_sharpe_by_strategy:
      e1_conservative: 0.0
      e2_moderate: 0.0
      e3_intraday: -5.0    # permissive while strategy is in development
    reject_if:
      nan_in_predictions: true
      nan_in_backtest: true
      sharpe_below_zero: true
      worse_than_baseline: true

  promotion:
    auto_promote: false          # Default conservador; habilitar con --auto-promote CLI flag
    first_champion_strategy: "promote"  # Si no hay champion, promover candidato si pasa guardrails
    min_improvement: 0.03        # Histéresis: exige +3% de mejora en el score compuesto para promover.
                                 # No es un gate estadístico (el ruido run-to-run del score es ±30-65%);
                                 # solo evita el churn por empates. El gate real es la revisión manual
                                 # (auto_promote=false + dry-run por defecto en promote_candidate).
    require_positive_sharpe: true  # Safety net: candidato debe tener bt_sharpe > 0

    # Comparación JUSTA: re-backtestea al champion (inferencia congelada) contra el
    # candidato sobre una ventana OOS común (fechas posteriores al train_data_end del
    # champion, que NINGUNO de los dos vio) en lugar de comparar métricas guardadas de
    # ventanas distintas. Ver src/lifecycle/reevaluation.py.
    fair_window: true
    # Mínimo de muestras OOS comunes para confiar en la comparación justa. Debajo de
    # esto se MANTIENE al champion (evidencia fresca insuficiente).
    min_eval_samples: 30

    # Scoring weights globales (fallback si la estrategia no tiene overrides).
    #
    # ⚠️ ATENCIÓN: estos pesos NO son los que deciden. compute_score suma las métricas en
    # escala CRUDA, así que el peso efectivo es w_i · std(metric_i). Medido sobre el registry:
    #   E1: bt_calmar 0.20 → efectivo 0.443 | ml_directional_accuracy 0.20 → efectivo 0.057
    #   E2: bt_sharpe 0.30 → efectivo 0.458 | ml_directional_accuracy 0.30 → efectivo 0.082
    # bt_sharpe + bt_calmar deciden el 85% (E1) / 82% (E2) y ambas salen de la MISMA curva
    # de equity. Ver el bloque `v2` abajo, que reemplaza esta suma ponderada.
    scoring_weights:
      bt_sharpe: 0.35
      ml_ic: 0.25
      ml_directional_accuracy: 0.20
      bt_calmar: 0.20

    # Regla v2: compuertas duras + UNA métrica primaria neutral a la deriva.
    # Elimina los pesos (nada que calibrar, peso nominal == peso efectivo por construcción).
    # Ver src/lifecycle/promotion.py::compute_score_v2 y src/metrics/skill.py.
    #
    # MODO SOMBRA: enabled=true la calcula y la registra en promotion_log.jsonl;
    # active=false hace que la decisión ejecutada siga siendo la v1. Activar (active=true)
    # recién tras medir el piso de ruido y revisar el backfill (pasos 3 y 4 del plan).
    v2:
      enabled: true
      active: false
      # "¿le gana a comprar y no hacer nada?" — Sharpe de la estrategia menos el de buy & hold
      # sobre la MISMA ventana. Una estrategia siempre-comprada sin costos da exactamente 0.
      primary_metric: "bt_sharpe_excess"
      # Compuertas binarias: el candidato debe superar ESTRICTAMENTE cada umbral.
      gates:
        bt_sharpe: 0.0            # no pierde plata
        ml_ic: 0.0                # ordena mejor que el azar
        ml_dir_acc_edge: 0.0      # supera al naive "siempre comprado"
      # Mejora ABSOLUTA mínima en la métrica primaria (no relativa: (c-ch)/ch sobre una
      # escala arbitraria no tiene interpretación y explota con denominador chico).
      # 0.0 hasta que scripts/evaluation/noise_floor.py mida la dispersión entre semillas.
      min_improvement_abs: 0.0

    # Overrides por estrategia.
    # Cada entrada puede redefinir cualquier campo de promotion (scoring_weights,
    # min_improvement, require_positive_sharpe, etc.).
    # Si una estrategia no aparece, se usan los valores globales de arriba.
    # Lookup jerárquico: per_strategy.{strategy} → per_strategy.{prefix} → global
    #   (prefix = parte antes del primer '_', e.g. "e1_conservative" → "e1")
    per_strategy:
      e1:
        # E1 conservador: horizonte largo (90d), prioriza Sharpe y Calmar
        scoring_weights:
          bt_sharpe: 0.35
          ml_ic: 0.25
          ml_directional_accuracy: 0.20
          bt_calmar: 0.20
      e2:
        # E2 moderado: horizonte corto (20d), más peso a directional_accuracy y Sharpe
        scoring_weights:
          bt_sharpe: 0.30
          ml_ic: 0.20
          ml_directional_accuracy: 0.30
          bt_calmar: 0.20
      e3:
        # E3 intradiario: horizonte corto (30min), mayor peso a profit_factor y directional_accuracy
        # require_positive_sharpe: false — el guardrail ya rechaza Sharpe < 0; no duplicar el
        # bloqueo en promoción con <= 0, para que modelos en desarrollo (Sharpe=0.0) puedan
        # participar en el lifecycle igual que e1/e2.
        require_positive_sharpe: false
        scoring_weights:
          bt_sharpe: 0.30
          ml_ic: 0.20
          ml_directional_accuracy: 0.25
          bt_calmar: 0.25
      # e4: {}   # TODO: definir al reconstruir E4 (pairs trading, métricas de spread/cointegración)

  retirement:
    keep_last_n: 5

# ---------------------------------------------------------------------------
# Optuna: configuración de optimización y rutas a parámetros tuneados
# ---------------------------------------------------------------------------
# El pipeline de entrenamiento lee tuned_params_path para resolver overrides.
# Los scripts de Optuna leen validation.method y validation.folds para
# definir cómo evaluar cada trial.
# ENV vars (E1_TUNED_PARAMS_PATH, E2_TUNED_PARAMS_PATH) están deprecados;
# funcionan como override de emergencia pero emiten un DeprecationWarning.
optuna:
  e1_conservative:
    tuned_params_path: "reports/hyperparameter_optimization/e1_tuned_params_by_ticker.yaml"
    fallback_to_base: true   # Si un ticker no tiene params tuneados, usar base.yaml
    validation:
      method: "walk_forward"   # "walk_forward" (alineado con training) | "time_split" (rápido)
      folds: 3                 # Reducido vs producción (5) para balance velocidad/robustez
  e2_moderate:
    tuned_params_path: "reports/hyperparameter_optimization/e2_tuned_params_by_ticker.yaml"
    fallback_to_base: true
    validation:
      method: "walk_forward"
      folds: 3
  e3_intraday:
    tuned_params_path: "reports/hyperparameter_optimization/e3_tuned_params_by_ticker.yaml"
    fallback_to_base: true
    validation:
      method: "walk_forward"
      folds: 3
