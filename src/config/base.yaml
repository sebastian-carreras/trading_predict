# Configuración base: estrategias E1/E2/E3/E4
# Objetivo: reproducibilidad (mismos parámetros -> mismos resultados)

project:
  name: trading_predict
  timezone: "America/New_York"
  seed: 42

universe:
  benchmark: "SPY"
  # Universo global (para descarga/limpieza). Es la unión de E1 + E2 (+ benchmark).
  tickers:
    - "YPFD.BA"
    - "GGAL.BA"
    - "PAMP.BA"
    - "BYMA.BA"
    - "CEPU.BA"
    - "AAPL"
    - "MSFT"
    - "JNJ"
    - "PG"
    - "V"
    - "BBAR.BA"
    - "BMA.BA"
    - "EDN.BA"
    - "TGSUD.BA"
    - "LOMA.BA"
    - "NVDA"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "NFLX"
    # E3 intradía (activos adicionales)
    - "TSLA"
    - "SPY"
    - "QQQ"
    - "AMD"

  # Asignación por estrategia (para entrenar/validar/backtest).
  tickers_by_strategy:
    e1_conservative:
      - "YPFD.BA"
      - "GGAL.BA"
      - "PAMP.BA"
      - "BYMA.BA"
      - "CEPU.BA"
      - "AAPL"
      - "MSFT"
      - "JNJ"
      - "PG"
      - "V"
    e2_moderate:
      - "BBAR.BA"
      - "BMA.BA"
      - "EDN.BA"
      - "TGSUD.BA"
      - "LOMA.BA"
      - "NVDA"
      - "GOOGL"
      - "AMZN"
      - "META"
      - "NFLX"
    e3_intraday:
      - "GGAL.BA"
      - "YPFD.BA"
      - "BMA,BA"
      - "BYMA.BA"
      - "PAMP.BA"
      - "TSLA"
      - "NVDA"
      - "SPY"
      - "QQQ"
      - "AMD"

costs:
  # Costos round-trip (entrada+salida). Usar en backtest neto.
  daily_round_trip_bps: 10
  intraday_round_trip_bps: 20

splits:
  method: "walk_forward"
  folds: 5
  # Embargo para evitar leakage por targets con horizonte H.
  embargo_days:
    e1: 90
    e2: 20
    e4: 0
    e3: 0

features:
  price:
    use_adjusted: true
    return_type: "log"  # log or simple

strategies:
  e1_conservative:
    enabled: true
    frequency: "1D"
    lookback_days: 180
    horizon_days: 90
    rebalance: "monthly"

    thresholds:
      tau_buy: 0.06
      tau_sell: 0.00

    filters:
      rsi14_max: 60
      regime:
        type: "sma200"  # sma200 | adx
        sma200_required: true
      bollinger:
        enabled: true
        bb_period: 20
        bb_std: 2
        percent_b_max: 0.9

    risk:
      stop_loss_pct: 0.10
      take_profit_pct: 0.15
      trailing_stop: false

    model:
      type: "GRU"
      gru_units: [64, 32]  # REDUCIDO de [128, 64] → menos parámetros = menos overfitting
      dropout: 0.3  # AUMENTADO de 0.2 → más regularización
      recurrent_dropout: 0.2  # AUMENTADO de 0.1 → más regularización en GRU
      dense_units: 16  # REDUCIDO de 32 → arquitectura más simple
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adamw"
      learning_rate: 0.001
      batch_size: 64
      max_epochs: 100  # REDUCIDO de 200 → evitar sobreajuste
      early_stopping_patience: 10  # REDUCIDO de 15 → parar antes si no mejora
      clipnorm: 1.0

    backtest:
      holding_period_days: 90  # Mantener posición por 90 días (igual que horizon)
      allow_short: false  # Solo long positions (estrategia conservadora)
      max_position: 1.0  # 100% del capital en una posición

  e2_moderate:
    enabled: true
    frequency: "1D"
    lookback_days: 60
    horizon_days: 20
    rebalance: "weekly"

    thresholds:
      tau_buy: 0.025
      tau_sell: 0.00

    filters:
      rsi14_min: 35
      rsi14_max: 70
      macd_confirmation: true
      volume_zscore_window: 20
      volume_zscore_min: 0

    risk:
      stop_loss_pct: 0.07
      take_profit_pct: 0.10
      time_stop_days: 20

    model:
      type: "LSTM"
      lstm_units: [128, 64]
      dropout: 0.2
      dense_units: 32
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adamw"
      learning_rate: 0.001
      batch_size: 64
      max_epochs: 150
      early_stopping_patience: 12
      clipnorm: 1.0

  e4_pairs:
    enabled: true
    frequency: "1D"
    training_window_days: 252
    beta_lookback_days: 120
    horizon_days: 10  # solo como confirmación
    recalibration: "monthly"

    entry_exit:
      entry_z: 2.0
      exit_z: 0.25
      stop_z: 3.0
      time_stop_days: 20

    filters:
      cointegration_pvalue_max: 0.05
      half_life_days_max: 20

    knn:
      enabled: true
      k_candidates: [5, 10, 20]
      distance: "euclidean"  # euclidean | mahalanobis

    # Pares objetivo (lista inicial, cerrada para la tesis).
    pairs:
      - ["GGAL", "BMA"]
      - ["YPF", "PAMP"]
      - ["EDN", "CEPU"]
      - ["KO", "PEP"]
      - ["XLE", "XLF"]

  e3_intraday:
    enabled: true
    frequency: "5min"
    bar_minutes: 5
    lookback_bars: 96
    horizon_bars: 6
    session_timezone: "America/New_York"

    thresholds:
      tau_buy: 0.001
      tau_sell: 0.001

    data:
      provider: "yfinance"
      period: "60d"
      interval: "5m"

    model:
      type: "LSTM_ENSEMBLE"
      ensemble_members: 3
      lstm_hidden_size: 64
      lstm_num_layers: 2
      dropout: 0.2
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adam"
      learning_rate: 0.001
      batch_size: 256
      max_epochs: 30
      early_stopping_patience: 5

    backtest:
      max_position: 1.0
      execution_delay_bars: 1
      allow_short: true

reporting:
  metrics:
    ml: ["mae", "rmse", "directional_accuracy"]
    trading: ["cagr", "sharpe", "sortino", "max_drawdown", "calmar", "profit_factor", "turnover", "hit_rate"]
  output_dir: "reports"
