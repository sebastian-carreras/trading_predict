# Configuración base: estrategias E1/E2/E3/E4
# Objetivo: reproducibilidad (mismos parámetros -> mismos resultados)

project:
  name: trading_predict
  timezone: "America/New_York"
  seed: 42

universe:
  benchmark: "SPY"
  # Universo global (para descarga/limpieza). Es la unión de E1 + E2 (+ benchmark).
  tickers:
    - "YPFD.BA"
    - "GGAL.BA"
    - "PAMP.BA"
    - "BYMA.BA"
    - "CEPU.BA"
    - "AAPL"
    - "MSFT"
    - "JNJ"
    - "PG"
    - "V"
    - "BBAR.BA"
    - "BMA.BA"
    - "EDN.BA"
    - "TGSUD.BA"
    - "LOMA.BA"
    - "NVDA"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "NFLX"
    # E3 intradía (activos adicionales)
    - "TSLA"
    - "SPY"
    - "QQQ"
    - "AMD"
    # E4 pairs trading (activos adicionales)
    - "TGSU2.BA"
    - "TGNO4.BA"
    - "YPF"
    - "KO"
    - "PEP"
    - "XOM"
    - "CVX"
    - "JPM"
    - "BAC"
    - "CAT"
    - "DE"

  # Asignación por estrategia (para entrenar/validar/backtest).
  tickers_by_strategy:
    e1_conservative:
      - "YPFD.BA"
      - "GGAL.BA"
      - "PAMP.BA"
      - "BYMA.BA"
      - "CEPU.BA"
      - "AAPL"
      - "MSFT"
      - "JNJ"
      - "PG"
      - "V"
    # e2, e3, e4: tickers se definirán cuando se reconstruyan las estrategias

costs:
  # Costos round-trip (entrada+salida). Usar en backtest neto.
  daily_round_trip_bps: 10
  intraday_round_trip_bps: 20

splits:
  method: "walk_forward"
  folds: 5
  # Embargo para evitar leakage por targets con horizonte H.
  embargo_days:
    e1: 90

strategies:
  e1_conservative:
    enabled: true
    frequency: "1D"
    lookback_days: 360
    horizon_days: 90
    rebalance: "monthly"

    thresholds:
      tau_buy: 0.02
      tau_sell: 0.00

    risk:
      stop_loss_pct: 0.10
      take_profit_pct: 0.15
      trailing_stop: false

    model:
      type: "GRU"
      gru_units: [64, 32]  # REDUCIDO de [128, 64] → menos parámetros = menos overfitting
      dropout: 0.3  # AUMENTADO de 0.2 → más regularización
      recurrent_dropout: 0.2  # AUMENTADO de 0.1 → más regularización en GRU
      dense_units: 16  # REDUCIDO de 32 → arquitectura más simple
      loss: "huber"
      huber_delta: 1.0
      optimizer: "adamw"
      learning_rate: 0.001
      batch_size: 64
      max_epochs: 100  # REDUCIDO de 200 → evitar sobreajuste
      early_stopping_patience: 10  # REDUCIDO de 15 → parar antes si no mejora
      clipnorm: 1.0

    backtest:
      holding_period_days: 90  # Mantener posición por 90 días (igual que horizon)
      allow_short: false  # Solo long positions (estrategia conservadora)
      max_position: 1.0  # 100% del capital en una posición

  e2_moderate:
    enabled: false  # TODO: rebuild from scratch
    frequency: "1D"
    horizon_days: 20

  e3_intraday:
    enabled: false  # TODO: rebuild from scratch
    frequency: "5min"
    horizon_bars: 6

  e4_pairs:
    enabled: false  # TODO: rebuild from scratch
    frequency: "1D"

reporting:
  metrics:
    ml: ["mae", "rmse", "directional_accuracy"]
    trading: ["cagr", "sharpe", "sortino", "max_drawdown", "calmar", "profit_factor", "turnover", "hit_rate"]
  output_dir: "reports"

lifecycle:
  enabled: true
  registry_path: "models/registry.json"
  metrics_log_path: "models/metrics_log.jsonl"

  guardrails:
    # Phase 1: only reject technically broken models.
    # Phase 2 (future): empirical thresholds from metrics_log.jsonl after 5-10 runs.
    phase: 1
    reject_if:
      nan_in_predictions: true
      nan_in_backtest: true
      sharpe_below_zero: true
      worse_than_baseline: true

  retirement:
    keep_last_n: 5
