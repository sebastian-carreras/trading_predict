# ============================================================
# Dashboard Alert Thresholds — Per Strategy
# ============================================================
# Defines alert levels (green/yellow/red) for each metric
# per strategy. Used by the dashboard checker and MLflow views.
#
# Convention:
#   green  = metric meets target (good)
#   yellow = metric is borderline (warning)
#   red    = metric fails threshold (action needed)
#
# For "lower is better" metrics (MAE, RMSE, max_drawdown):
#   green  = value ≤ green_max
#   yellow = green_max < value ≤ red_min
#   red    = value > red_min
#
# For "higher is better" metrics (IC, dir_acc, sharpe, cagr):
#   green  = value ≥ green_min
#   yellow = red_max ≤ value < green_min
#   red    = value < red_max
# ============================================================

strategies:
  # ----------------------------------------------------------
  # E1 Simple — Desarrollo rápido, experimentación
  # ----------------------------------------------------------
  e1_simple:
    display_name: "E1 Simple"
    experiment_name: "E1_Simple"
    description: "GRU 1 capa, time split, horizon 90d"

    metrics:
      # --- ML Metrics ---
      # Umbrales calibrados con distribución real de métricas (feb 2026)
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.15       # p25 ~ 0.08, buen modelo < 0.15
        red_min: 0.35         # p75 ~ 0.35, modelo pobre > 0.35
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.20       # p25 ~ 0.10
        red_min: 0.45         # p75 ~ 0.43
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.10       # correlación positiva significativa
        red_max: -0.05        # anticorrelación = señal invertida
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.55
        red_max: 0.50
        unit: "%"

      # --- Trading Metrics ---
      bt_sharpe:
        direction: "higher_is_better"
        green_min: 1.0
        red_max: 0.3
        unit: ""

      bt_sortino:
        direction: "higher_is_better"
        green_min: 1.2
        red_max: 0.3
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.08
        red_max: 0.0
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"   # abs value: 0.30 means -30%
        green_max: 0.30
        red_min: 0.55
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.5
        red_max: 0.1
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.3
        red_max: 1.0
        unit: ""

    timing:
      train_seconds:
        warn_above: 120    # >2 min per ticker = warning
        critical_above: 300  # >5 min = critical
      predict_seconds:
        warn_above: 5
        critical_above: 15

  # ----------------------------------------------------------
  # E1 Conservative — Producción, walk-forward
  # ----------------------------------------------------------
  e1_conservative:
    display_name: "E1 Conservative"
    experiment_name: "E1_Conservative_Strategy"
    description: "GRU 2 capas, walk-forward 5 folds, horizon 90d"

    metrics:
      # Umbrales calibrados con distribución real de métricas (feb 2026)
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.15
        red_min: 0.35
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.20
        red_min: 0.45
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.10
        red_max: -0.05
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.55
        red_max: 0.50
        unit: "%"

      bt_sharpe:
        direction: "higher_is_better"
        green_min: 1.0
        red_max: 0.3
        unit: ""

      bt_sortino:
        direction: "higher_is_better"
        green_min: 1.2
        red_max: 0.3
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.0
        red_max: -0.05
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.30
        red_min: 0.55
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.5
        red_max: 0.1
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.3
        red_max: 1.0
        unit: ""

    timing:
      train_seconds:
        warn_above: 600    # ~5 min per ticker (walk-forward)
        critical_above: 1200
      predict_seconds:
        warn_above: 10
        critical_above: 30

  # ----------------------------------------------------------
  # E2 Baseline — Referencia fija (Ridge Regression)
  # ----------------------------------------------------------
  e2_baseline:
    display_name: "E2 Baseline"
    experiment_name: "E2_Baseline"
    description: "Ridge Regression (α=1.0), walk-forward, horizon 20d — referencia fija"

    metrics:
      # Umbrales calibrados con métricas reales del baseline (feb 2026)
      # Más permisivos que e2_moderate (es un modelo lineal simple)
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.30       # baseline típico ~0.35, verde si mejora
        red_min: 0.50         # muy pobre para un baseline
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.40       # baseline típico ~0.53
        red_min: 0.70
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.0        # cualquier correlación positiva es buena
        red_max: -0.15        # anticorrelación fuerte
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.52       # apenas mejor que azar
        red_max: 0.45
        unit: "%"

      bt_sharpe:
        direction: "higher_is_better"
        green_min: 0.3        # baseline con sharpe > 0.3 ya es decente
        red_max: 0.0
        unit: ""

      bt_sortino:
        direction: "higher_is_better"
        green_min: 0.3
        red_max: 0.0
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.05
        red_max: 0.0
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.50       # baseline típico ~0.44
        red_min: 0.75
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.15
        red_max: 0.03
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.05       # baseline apenas rentable ya es ok
        red_max: 1.0
        unit: ""

    timing:
      train_seconds:
        warn_above: 10      # Ridge es muy rápido (~0.3s)
        critical_above: 30
      predict_seconds:
        warn_above: 2
        critical_above: 10

  # ----------------------------------------------------------
  # E2 Simple — Swing trading simplificado
  # ----------------------------------------------------------
  e2_simple:
    display_name: "E2 Simple"
    experiment_name: "E2_Simple"
    description: "LSTM 2 capas, time split, horizon 20d"

    metrics:
      # Umbrales alineados con E2 Moderate (misma escala, sin datos propios aún)
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.10
        red_min: 0.18
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.13
        red_min: 0.22
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.05
        red_max: -0.10
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.55
        red_max: 0.48
        unit: "%"

      bt_sharpe:
        direction: "higher_is_better"
        green_min: 0.5
        red_max: 0.1
        unit: ""

      bt_sortino:
        direction: "higher_is_better"
        green_min: 0.4
        red_max: 0.1
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.08
        red_max: 0.02
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.45
        red_min: 0.70
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.20
        red_max: 0.05
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.10
        red_max: 1.0
        unit: ""

    timing:
      train_seconds:
        warn_above: 180
        critical_above: 600
      predict_seconds:
        warn_above: 5
        critical_above: 15

  # ----------------------------------------------------------
  # E2 Moderate — Swing trading robusto
  # ----------------------------------------------------------
  e2_moderate:
    display_name: "E2 Moderate"
    experiment_name: "E2_Moderate"
    description: "LSTM 2 capas, walk-forward, horizon 20d"

    metrics:
      # Umbrales calibrados con distribución real de métricas (feb 2026)
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.10       # p25 ~ 0.085
        red_min: 0.18         # p75 ~ 0.14, modelo pobre > 0.18
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.13       # p25 ~ 0.11
        red_min: 0.22         # p75 ~ 0.18
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.05       # correlación positiva significativa
        red_max: -0.10        # anticorrelación fuerte
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.55
        red_max: 0.48
        unit: "%"

      bt_sharpe:
        direction: "higher_is_better"
        green_min: 0.5        # median ~ 0.33, top quartile > 0.75
        red_max: 0.1
        unit: ""

      bt_sortino:
        direction: "higher_is_better"
        green_min: 0.4        # median ~ 0.24
        red_max: 0.1
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.08       # median ~ 0.096
        red_max: 0.02
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.45       # median ~ 0.49
        red_min: 0.70         # peor caso real ~ 0.75
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.20       # median ~ 0.21
        red_max: 0.05
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.10       # median ~ 1.08
        red_max: 1.0          # < 1.0 = pierde plata
        unit: ""

    timing:
      train_seconds:
        warn_above: 600
        critical_above: 1200
      predict_seconds:
        warn_above: 10
        critical_above: 30

  # ----------------------------------------------------------
  # E3 Baseline — Referencia fija (Ridge Regression 5-min)
  # ----------------------------------------------------------
  e3_baseline:
    display_name: "E3 Baseline"
    experiment_name: "E3_Baseline"
    description: "Ridge Regression, split 70/15/15, 5-min bars, horizon 6 bars — referencia fija"

    metrics:
      # --- ML Metrics ---
      # Umbrales permisivos — Ridge sobre 960 features aplanadas es un floor intencional
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.002       # MAE intraday bajo (retornos ~0.001–0.005)
        red_min: 0.005         # MAE muy alto = modelo sin señal
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.003
        red_min: 0.008
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.01        # cualquier correlación positiva
        red_max: -0.05         # anticorrelación
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.51        # apenas mejor que azar
        red_max: 0.45
        unit: "%"

      # --- Trading Metrics ---
      # Baseline esperado con Sharpe muy negativo (~-20 a -60); umbrales calibrados como floor
      bt_sharpe:
        direction: "higher_is_better"
        green_min: -1.0        # cualquier sharpe > -1 es "aceptable para un baseline"
        red_max: -10.0         # sharpe < -10 = señal invertida / costos > ganancia
        unit: ""

      bt_cagr:
        direction: "higher_is_better"
        green_min: 0.0
        red_max: -0.5
        unit: "%"

      bt_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.50
        red_min: 0.90
        unit: "%"

      bt_calmar:
        direction: "higher_is_better"
        green_min: 0.0
        red_max: -0.5
        unit: ""

      bt_profit_factor:
        direction: "higher_is_better"
        green_min: 1.0         # break even
        red_max: 0.70
        unit: ""

    timing:
      train_seconds:
        warn_above: 120        # Ridge sobre 100K barras ~30-60s; >2min = lento
        critical_above: 300
      predict_seconds:
        warn_above: 10
        critical_above: 30

  # ----------------------------------------------------------
  # E3 Intraday — Intraday 5-min bars
  # ----------------------------------------------------------
  e3_intraday:
    display_name: "E3 Intraday"
    experiment_name: "E3_Intraday"
    description: "LSTM Ensemble (3 members), 5-min bars, horizon 6 bars"

    metrics:
      ml_mae:
        direction: "lower_is_better"
        green_max: 0.001
        red_min: 0.003
        unit: ""

      ml_rmse:
        direction: "lower_is_better"
        green_max: 0.002
        red_min: 0.005
        unit: ""

      ml_ic:
        direction: "higher_is_better"
        green_min: 0.03
        red_max: 0.01
        unit: ""

      ml_directional_accuracy:
        direction: "higher_is_better"
        green_min: 0.52
        red_max: 0.48
        unit: "%"

      # E3 uses tr_ prefix for trading metrics
      tr_profit_factor:
        direction: "higher_is_better"
        green_min: 1.4
        red_max: 1.0
        unit: ""

      tr_max_drawdown:
        direction: "lower_is_better"
        green_max: 0.03
        red_min: 0.05
        unit: "%"

    timing:
      train_seconds:
        warn_above: 300
        critical_above: 900
      predict_seconds:
        warn_above: 10
        critical_above: 30

  # ----------------------------------------------------------
  # E4 Pairs — Pairs trading (cointegración)
  # ----------------------------------------------------------
  e4_pairs:
    display_name: "E4 Pairs"
    experiment_name: "E4_Pairs"
    description: "Pairs trading, KNN signals, cointegración"

    metrics:
      sharpe:
        direction: "higher_is_better"
        green_min: 1.0
        red_max: 0.5
        unit: ""

      max_drawdown:
        direction: "lower_is_better"
        green_max: 0.10
        red_min: 0.20
        unit: "%"

      win_rate:
        direction: "higher_is_better"
        green_min: 0.55
        red_max: 0.45
        unit: "%"

      total_return:
        direction: "higher_is_better"
        green_min: 0.05
        red_max: 0.0
        unit: "%"

    timing:
      train_seconds:
        warn_above: 300
        critical_above: 900
      predict_seconds:
        warn_above: 10
        critical_above: 30
