name: CI

# Cuándo corre: en cada push a main y en cada Pull Request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Corre en las dos versiones que usás localmente, en paralelo.
      # Si no pasa una, la otra sigue (no aborta todo).
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # 1. Clona tu repo en el runner limpio.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala Python y cachea las dependencias de pip
      #    (acelera corridas siguientes; la key se basa en requirements.txt).
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Instala las dependencias del proyecto.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch CPU-only: evita bajar el wheel con CUDA (>1GB) que el runner sin GPU no usa.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # 4. Corre la suite. `python -m pytest` agrega el repo root al
      #    sys.path, así los `from src...` de tus tests resuelven bien.
      - name: Run tests
        run: python -m pytest -v
